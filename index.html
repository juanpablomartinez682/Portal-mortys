@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 38px #75ff4f,inset 0 0 35px #75ff4f}}
.buttons{display:grid;gap:13px;margin-bottom:25px}.btn{border:0;border-radius:14px;padding:17px;font-size:18px;font-weight:bold;color:#10130f;background:#9cff57;box-shadow:0 5px 0 #4b9c2b}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #4b9c2b}.secondary{background:#222a31;color:#e8eef0;box-shadow:0 5px 0 #11161a}.footer{text-align:center;color:#59636a;font-size:11px}
#screen{display:none;position:fixed;inset:0;background:#10131b;color:white;padding:30px 22px;z-index:5;overflow:auto}.back{background:#222a31;border:0;color:white;padding:10px 15px;border-radius:10px}.card{margin-top:20px;padding:18px;border-radius:18px;background:#1b2329;border:1px solid #36434b}
.fight{border:0;border-radius:8px;padding:8px 12px;background:#ffcc66;font-weight:bold;margin-left:5px}
.battle{background:linear-gradient(160deg,#253a42,#111820);border-radius:18px;padding:16px;margin-top:12px}.arena{display:flex;justify-content:space-between;gap:12px}.fighter{flex:1;text-align:center;background:#1c2930;border-radius:14px;padding:14px}.monster{font-size:55px}.hp{height:12px;background:#343b3d;border-radius:10px;overflow:hidden;margin:8px 0}.hp i{display:block;height:100%;width:100%;background:#9cff57}.battlelog{min-height:45px;margin:12px 0;padding:10px;background:#0c1115;border-radius:10px;color:#d7e0e3}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{border:0;border-radius:10px;padding:13px;font-weight:bold;background:#9cff57}.actions .dark{background:#2b353b;color:#fff}
.morty-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.morty-card{background:#182126;border:1px solid #33434b;border-radius:14px;padding:13px}.morty-icon{font-size:42px;text-align:center}.rarity{font-size:11px;letter-spacing:1px;color:#9cff57}.stat{font-size:12px;color:#c7d0d4;margin-top:5px}.xp{height:7px;background:#343b3d;border-radius:8px;overflow:hidden;margin-top:7px}.xp i{display:block;height:100%;width:35%;background:#73d8ff}
#map{height:430px;margin-top:15px;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(135deg,#49634c,#304936 45%,#65735a);border:3px solid #607667}
.road{position:absolute;background:#4a4e4a;box-shadow:inset 0 0 0 3px #696d67}.r1{width:120%;height:58px;top:75px;left:-10%;transform:rotate(12deg)}.r2{width:60px;height:120%;left:55%;top:-10%;transform:rotate(-20deg)}.r3{width:100%;height:42px;bottom:95px;left:0;transform:rotate(-7deg)}
.player{position:absolute;left:48%;top:49%;font-size:34px;filter:drop-shadow(0 2px 2px #000);z-index:2}
.spawn,.portalSpawn{position:absolute;border:0;border-radius:50%;width:52px;height:52px;font-size:27px;background:#b9ff8c;box-shadow:0 0 18px #8cff62;z-index:3}.s1{left:20%;top:25%}.s2{right:15%;bottom:24%}.portalSpawn{right:12%;top:18%;background:#6ffff0;box-shadow:0 0 25px #45fff0}
.hud{position:absolute;left:12px;top:12px;background:#111c19dd;padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.5}.catch{border:0;border-radius:8px;padding:8px 12px;background:#9cff57;font-weight:bold}

.collection-screen{padding:18px 12px 28px}
.collection-head{display:flex;align-items:center;gap:10px;position:relative;margin-bottom:15px}
.collection-head h2{margin:0;font-size:25px;flex:1}
.collection-count{background:#27333a;border-radius:18px;padding:7px 12px;font-weight:800}
.backbtn{background:#27333a;color:#fff;border:0;border-radius:12px;padding:10px 13px;font-weight:800}
.active-panel{background:linear-gradient(145deg,#23363d,#182128);border:2px solid #8cff55;border-radius:18px;padding:15px;margin-bottom:18px}
.active-title{font-weight:900;letter-spacing:.5px;margin-bottom:10px}
.active-body{display:flex;gap:15px;align-items:center}
.big-icon{font-size:72px;min-width:82px;text-align:center}
.active-info{flex:1}
.active-info h3{font-size:24px;margin:0 0 4px}
.level{font-weight:800;margin:7px 0}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-weight:800;margin:8px 0}
.section-title{margin:12px 2px}
.collection-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.collection-card{background:#202b32;color:#fff;border:2px solid #33434b;border-radius:16px;padding:12px;text-align:left}
.collection-card.selected{border-color:#8cff55;box-shadow:0 0 0 1px #8cff55}
.card-top{display:flex;justify-content:space-between;align-items:center;font-size:38px}
.card-top b{font-size:10px;background:#8cff55;color:#142014;padding:5px 7px;border-radius:8px}
.collection-card h3{font-size:16px;margin:5px 0}
.rarity{font-size:12px;opacity:.8}
.mini-level{font-weight:800;margin:8px 0 4px}
.mini-stats{font-size:11px;font-weight:800}
.xp-label{font-size:11px;margin-top:8px;font-weight:700}

</style>
</head>
<body>
<div class="game" id="menu">
  <div class="logo">
    <h1>PORTAL<br>MORTYS</h1>
    <p>DIMENSIONES • CAPTURA • COMBATE</p>
    <div class="portal"></div>
  </div>
  <div class="buttons">
    <button class="btn" onclick="play()">JUGAR</button>
    <button class="btn secondary" onclick="show('collection')">MIS MORTYS</button>
    <button class="btn secondary" onclick="show('settings')">AJUSTES</button>
  </div>
  <div class="footer">PROTOTIPO 0.1 • HECHO PARA MÓVIL</div>
</div>
<div id="screen">
  <button class="back" onclick="back()">← VOLVER</button>
  <div class="card" id="content"></div>
</div>
<script>
if(localStorage.getItem('portalMortysRosterV4')!=='1'){
 localStorage.removeItem('portalMortys');
 localStorage.setItem('portalMortysRosterV4','1');
}
const MORTY_DATA = {
 'Morty': {type:'Normal',rarity:'EXÓTICO',level:1,hp:45,atk:45,def:45,spd:40,icon:'👦'},
 'Morty Roñoso': {type:'Normal',rarity:'COMÚN',level:1,hp:35,atk:32,def:34,spd:30,icon:'👦'},
 'Morty Desaliñado': {type:'Normal',rarity:'COMÚN',level:1,hp:36,atk:34,def:31,spd:31,icon:'👦'},
 'Morty Mendigo': {type:'Normal',rarity:'COMÚN',level:1,hp:38,atk:35,def:29,spd:28,icon:'👦'},
 'Morty Viejo': {type:'Normal',rarity:'COMÚN',level:1,hp:40,atk:36,def:36,spd:24,icon:'👴'},
 'Morty Geriátrico': {type:'Normal',rarity:'RARO',level:1,hp:43,atk:38,def:39,spd:20,icon:'👴'},
 'Morty Antiguo': {type:'Normal',rarity:'RARO',level:1,hp:46,atk:41,def:41,spd:18,icon:'👴'},
 'Morty Conejo': {type:'Normal',rarity:'COMÚN',level:1,hp:34,atk:31,def:30,spd:44,icon:'🐰'}
};

let mortys = JSON.parse(localStorage.getItem('portalMortys')) || [
 {name:'Morty', ...MORTY_DATA['Morty'], xp:0, activo:true}
];
// Limpieza de personajes ficticios de versiones anteriores.

const gameState = JSON.parse(localStorage.getItem('portalMortysGameState')||'null') || {
 coins:150, capsules:5, potions:3, energy:10, maxEnergy:10,
 trainerXP:0, trainerLevel:1, zone:1,
 quests:{captures:0,wins:0,portals:0},
 badges:[]
};
function saveGameState(){localStorage.setItem('portalMortysGameState',JSON.stringify(gameState));}
function addXP(n){
 gameState.trainerXP+=n;
 const need=100+(gameState.trainerLevel-1)*100;
 if(gameState.trainerXP>=need){gameState.trainerXP-=need;gameState.trainerLevel++;}
 saveGameState();
}
function shop(){
 return `<h2>🏪 TIENDA</h2>
 <div class="panel"><b>💰 Monedas: ${gameState.coins}</b></div>
 <div class="shop-grid">
  <div class="shop-item"><h3>🔵 Cápsula</h3><p>+1 cápsula de captura</p><b>25 💰</b><br><button class="btn secondary" onclick="buy('capsule')">COMPRAR</button></div>
  <div class="shop-item"><h3>🧪 Poción</h3><p>+1 poción</p><b>20 💰</b><br><button class="btn secondary" onclick="buy('potion')">COMPRAR</button></div>
  <div class="shop-item"><h3>⚡ Energía</h3><p>+3 energía</p><b>15 💰</b><br><button class="btn secondary" onclick="buy('energy')">COMPRAR</button></div>
 </div>`;
}
function buy(item){
 const cost={capsule:25,potion:20,energy:15}[item];
 if(gameState.coins<cost){alert('No tienes suficientes monedas.');return;}
 gameState.coins-=cost;
 if(item==='capsule')gameState.capsules++;
 if(item==='potion')gameState.potions++;
 if(item==='energy')gameState.energy=Math.min(gameState.maxEnergy,gameState.energy+3);
 saveGameState(); show('shop');
}
function quests(){
 const q=gameState.quests;
 return `<h2>📜 MISIONES</h2>
 <div class="panel"><b>🎯 Capturista</b><p>Captura 3 Mortys: ${Math.min(q.captures,3)}/3</p></div>
 <div class="panel"><b>⚔️ Entrenador</b><p>Gana 3 combates: ${Math.min(q.wins,3)}/3</p></div>
 <div class="panel"><b>🌀 Explorador</b><p>Encuentra 2 portales: ${Math.min(q.portals,2)}/2</p></div>`;
}
function badges(){
 const q=gameState.quests;
 const list=[
  ['🧪','Primer Morty',q.captures>=1],
  ['⚔️','Primera victoria',q.wins>=1],
  ['🌀','Primer portal',q.portals>=1],
  ['🏆','Coleccionista',mortys.length>=6],
  ['⭐','Entrenador Nv. 5',gameState.trainerLevel>=5],
  ['🔥','Veterano',q.wins>=10]
 ];
 return `<h2>🏅 MEDALLAS</h2><div class="badges">${list.map(x=>`<div class="badge ${x[2]?'':'locked'}"><div style="font-size:30px">${x[0]}</div><b>${x[1]}</b><div>${x[2]?'DESBLOQUEADA':'BLOQUEADA'}</div></div>`).join('')}</div>`;
}
function settings(){
 return `<h2>⚙️ AJUSTES</h2><div class="panel"><b>💾 Partida guardada automáticamente</b><p class="small">Tu colección, monedas, energía y progreso se guardan en este dispositivo.</p></div><button class="btn secondary" onclick="resetGame()">♻️ REINICIAR PARTIDA</button>`;
}
function resetGame(){
 if(confirm('¿Seguro que quieres borrar todo el progreso?')){
  localStorage.removeItem('portalMortys');
  localStorage.removeItem('portalMortysGameState');
  location.reload();
 }
}
const personajesPermitidos = Object.keys(MORTY_DATA);
mortys = mortys.filter(m => personajesPermitidos.includes(m.name));
if (!mortys.length) mortys = [{name:'Morty', ...MORTY_DATA['Morty'], xp:0, activo:true}];
localStorage.setItem('portalMortys', JSON.stringify(mortys));

function seleccionarMorty(i){
 if(!mortys[i]) return;
 mortys.forEach((m,n)=>m.activo=(n===i));
 localStorage.setItem('portalMortys', JSON.stringify(mortys));
 renderCollection();
}
function xpNecesaria(nivel){ return 100 + (nivel-1)*50; }
function ganarXP(morty, cantidad){
 morty.xp=(morty.xp||0)+cantidad;
 const req=xpNecesaria(morty.level||1);
 if(morty.xp>=req){
   morty.xp-=req; morty.level=(morty.level||1)+1;
   morty.hp+=5; morty.atk+=3; morty.def+=3; morty.spd+=2;
   return true;
 }
 return false;
}
function renderCollection(){
 const activos=mortys.filter(m=>m.activo);
 const activo=activos[0]||mortys[0];
 return `<div class="collection-screen">
  <div class="collection-head">
   <button class="backbtn" onclick="back()">← VOLVER</button>
   <h2>🧪 MIS MORTYS</h2>
   <div class="collection-count">${mortys.length}/6</div>
  </div>
  <div class="active-panel">
   <div class="active-title">👑 MORTY ACTIVO</div>
   <div class="active-body">
    <div class="big-icon">${activo?activo.icon:'🧪'}</div>
    <div class="active-info">
     <h3>${activo?activo.name:'Sin Morty'}</h3>
     <div class="rarity">${activo?(activo.rarity+' • '+activo.type):''}</div>
     <div class="level">⭐ NIVEL ${activo?(activo.level||1):1}</div>
     <div class="stats-row">
      <span>❤️ ${activo?activo.hp:0}</span>
      <span>⚔️ ${activo?activo.atk:0}</span>
      <span>🛡️ ${activo?activo.def:0}</span>
      <span>⚡ ${activo?activo.spd:0}</span>
     </div>
     <div class="xp-label">✨ XP ${activo?(activo.xp||0):0}/${activo?xpNecesaria(activo.level||1):100}</div>
     <div class="xp"><i style="width:${activo?Math.min(100,(activo.xp||0)/xpNecesaria(activo.level||1)*100):0}%"></i></div>
    </div>
   </div>
  </div>
  <h3 class="section-title">TU COLECCIÓN</h3>
  <div class="collection-grid">${mortys.map((m,i)=>{
   const req=xpNecesaria(m.level||1), xp=m.xp||0;
   return `<button class="collection-card ${m.activo?'selected':''}" onclick="seleccionarMorty(${i})">
    <div class="card-top"><span>${m.icon}</span>${m.activo?'<b>👑 ACTIVO</b>':''}</div>
    <h3>${m.name}</h3>
    <div class="rarity">${m.rarity} • ${m.type}</div>
    <div class="mini-level">⭐ Nivel ${m.level||1}</div>
    <div class="mini-stats">❤️${m.hp} &nbsp; ⚔️${m.atk} &nbsp; 🛡️${m.def} &nbsp; ⚡${m.spd}</div>
    <div class="xp-label">✨ ${xp}/${req} XP</div>
    <div class="xp"><i style="width:${Math.min(100,xp/req*100)}%"></i></div>
   </button>`;
  }).join('')}</div>
 </div>`;
}
function show(type){
 document.getElementById('screen').style.display='block';
 if(type==='menu'){back();return;}
 const views={collection:renderCollection,shop,quests,badges,settings};
 document.getElementById('content').innerHTML = views[type]?views[type]():settings();
}
function back(){document.getElementById('screen').style.display='none'}
function play(){
 document.getElementById('screen').style.display='block';
 const zoneNames=['Jardines','Ciudad Mutante','Laboratorio','Dimensión Oscura'];
 document.getElementById('content').innerHTML=`
 <div class="topbar"><button class="back" onclick="back()">← VOLVER</button><span class="pill">💰 ${gameState.coins}</span><span class="pill">🔵 ${gameState.capsules}</span><span class="pill">🧪 ${gameState.potions}</span><span class="pill">⚡ ${gameState.energy}/${gameState.maxEnergy}</span></div>
 <h2>📍 EXPLORACIÓN</h2>
 <div class="panel"><b>DIMENSIÓN ${gameState.zone}: ${zoneNames[gameState.zone-1]}</b><div class="energy" style="margin-top:8px"><i style="width:${gameState.energy/gameState.maxEnergy*100}%"></i></div></div>
 <div id="map">
   <div class="road r1"></div><div class="road r2"></div><div class="road r3"></div>
   <div class="player">🧑‍🔬</div>
   <button class="spawn s1" onclick="encounter('Morty Roñoso')">👦</button>
   <button class="spawn s2" onclick="encounter('Morty Conejo')">🐰</button>
   <button class="portalSpawn" onclick="encounter('Portal dimensional')">🌀</button>
   <div class="hud"><b>${(mortys.find(m=>m.activo)||mortys[0]).name}</b><br>⭐ Entrenador ${gameState.trainerLevel}<br>🧪 Mortys: ${mortys.length}/6</div>
 </div>
 <p id="mapmsg">Explora la zona y toca un encuentro.</p>
 <div class="map-controls">
  <button class="btn secondary" onclick="changeZone(-1)">◀ ZONA</button>
  <button class="btn secondary" onclick="changeZone(1)">ZONA ▶</button>
 </div>`;
}
function changeZone(dir){
 if(gameState.energy<=0){alert('Te quedaste sin energía. Compra energía en la tienda.');return;}
 gameState.energy--;
 gameState.zone=Math.max(1,Math.min(4,gameState.zone+dir));
 saveGameState(); play();
}

.collection-screen{padding:18px 12px 28px}
.collection-head{display:flex;align-items:center;gap:10px;position:relative;margin-bottom:15px}
.collection-head h2{margin:0;font-size:25px;flex:1}
.collection-count{background:#27333a;border-radius:18px;padding:7px 12px;font-weight:800}
.backbtn{background:#27333a;color:#fff;border:0;border-radius:12px;padding:10px 13px;font-weight:800}
.active-panel{background:linear-gradient(145deg,#23363d,#182128);border:2px solid #8cff55;border-radius:18px;padding:15px;margin-bottom:18px}
.active-title{font-weight:900;letter-spacing:.5px;margin-bottom:10px}
.active-body{display:flex;gap:15px;align-items:center}
.big-icon{font-size:72px;min-width:82px;text-align:center}
.active-info{flex:1}
.active-info h3{font-size:24px;margin:0 0 4px}
.level{font-weight:800;margin:7px 0}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-weight:800;margin:8px 0}
.section-title{margin:12px 2px}
.collection-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.collection-card{background:#202b32;color:#fff;border:2px solid #33434b;border-radius:16px;padding:12px;text-align:left}
.collection-card.selected{border-color:#8cff55;box-shadow:0 0 0 1px #8cff55}
.card-top{display:flex;justify-content:space-between;align-items:center;font-size:38px}
.card-top b{font-size:10px;background:#8cff55;color:#142014;padding:5px 7px;border-radius:8px}
.collection-card h3{font-size:16px;margin:5px 0}
.rarity{font-size:12px;opacity:.8}
.mini-level{font-weight:800;margin:8px 0 4px}
.mini-stats{font-size:11px;font-weight:800}
.xp-label{font-size:11px;margin-top:8px;font-weight:700}

</style>
</head>
<body>
<div class="game" id="menu">
  <div class="logo">
    <h1>PORTAL<br>MORTYS</h1>
    <p>DIMENSIONES • CAPTURA • COMBATE</p>
    <div class="portal"></div>
  </div>
  <div class="buttons">
    <button class="btn" onclick="play()">JUGAR</button>
    <button class="btn secondary" onclick="show('collection')">MIS MORTYS</button>
    <button class="btn secondary" onclick="show('settings')">AJUSTES</button>
  </div>
  <div class="footer">PROTOTIPO 0.1 • HECHO PARA MÓVIL</div>
</div>
<div id="screen">
  <button class="back" onclick="back()">← VOLVER</button>
  <div class="card" id="content"></div>
</div>
<script>
if(localStorage.getItem('portalMortysRosterV4')!=='1'){
 localStorage.removeItem('portalMortys');
 localStorage.setItem('portalMortysRosterV4','1');
}
const MORTY_DATA = {
 'Morty': {type:'Normal',rarity:'EXÓTICO',level:1,hp:45,atk:45,def:45,spd:40,icon:'👦'},
 'Morty Roñoso': {type:'Normal',rarity:'COMÚN',level:1,hp:35,atk:32,def:34,spd:30,icon:'👦'},
 'Morty Desaliñado': {type:'Normal',rarity:'COMÚN',level:1,hp:36,atk:34,def:31,spd:31,icon:'👦'},
 'Morty Mendigo': {type:'Normal',rarity:'COMÚN',level:1,hp:38,atk:35,def:29,spd:28,icon:'👦'},
 'Morty Viejo': {type:'Normal',rarity:'COMÚN',level:1,hp:40,atk:36,def:36,spd:24,icon:'👴'},
 'Morty Geriátrico': {type:'Normal',rarity:'RARO',level:1,hp:43,atk:38,def:39,spd:20,icon:'👴'},
 'Morty Antiguo': {type:'Normal',rarity:'RARO',level:1,hp:46,atk:41,def:41,spd:18,icon:'👴'},
 'Morty Conejo': {type:'Normal',rarity:'COMÚN',level:1,hp:34,atk:31,def:30,spd:44,icon:'🐰'}
};

let mortys = JSON.parse(localStorage.getItem('portalMortys')) || [
 {name:'Morty', ...MORTY_DATA['Morty'], xp:0, activo:true}
];
// Limpieza de personajes ficticios de versiones anteriores.

const gameState = JSON.parse(localStorage.getItem('portalMortysGameState')||'null') || {
 coins:150, capsules:5, potions:3, energy:10, maxEnergy:10,
 trainerXP:0, trainerLevel:1, zone:1,
 quests:{captures:0,wins:0,portals:0},
 badges:[]
};
function saveGameState(){localStorage.setItem('portalMortysGameState',JSON.stringify(gameState));}
function addXP(n){
 gameState.trainerXP+=n;
 const need=100+(gameState.trainerLevel-1)*100;
 if(gameState.trainerXP>=need){gameState.trainerXP-=need;gameState.trainerLevel++;}
 saveGameState();
}
function shop(){
 return `<h2>🏪 TIENDA</h2>
 <div class="panel"><b>💰 Monedas: ${gameState.coins}</b></div>
 <div class="shop-grid">
  <div class="shop-item"><h3>🔵 Cápsula</h3><p>+1 cápsula de captura</p><b>25 💰</b><br><button class="btn secondary" onclick="buy('capsule')">COMPRAR</button></div>
  <div class="shop-item"><h3>🧪 Poción</h3><p>+1 poción</p><b>20 💰</b><br><button class="btn secondary" onclick="buy('potion')">COMPRAR</button></div>
  <div class="shop-item"><h3>⚡ Energía</h3><p>+3 energía</p><b>15 💰</b><br><button class="btn secondary" onclick="buy('energy')">COMPRAR</button></div>
 </div>`;
}
function buy(item){
 const cost={capsule:25,potion:20,energy:15}[item];
 if(gameState.coins<cost){alert('No tienes suficientes monedas.');return;}
 gameState.coins-=cost;
 if(item==='capsule')gameState.capsules++;
 if(item==='potion')gameState.potions++;
 if(item==='energy')gameState.energy=Math.min(gameState.maxEnergy,gameState.energy+3);
 saveGameState(); show('shop');
}
function quests(){
 const q=gameState.quests;
 return `<h2>📜 MISIONES</h2>
 <div class="panel"><b>🎯 Capturista</b><p>Captura 3 Mortys: ${Math.min(q.captures,3)}/3</p></div>
 <div class="panel"><b>⚔️ Entrenador</b><p>Gana 3 combates: ${Math.min(q.wins,3)}/3</p></div>
 <div class="panel"><b>🌀 Explorador</b><p>Encuentra 2 portales: ${Math.min(q.portals,2)}/2</p></div>`;
}
function badges(){
 const q=gameState.quests;
 const list=[
  ['🧪','Primer Morty',q.captures>=1],
  ['⚔️','Primera victoria',q.wins>=1],
  ['🌀','Primer portal',q.portals>=1],
  ['🏆','Coleccionista',mortys.length>=6],
  ['⭐','Entrenador Nv. 5',gameState.trainerLevel>=5],
  ['🔥','Veterano',q.wins>=10]
 ];
 return `<h2>🏅 MEDALLAS</h2><div class="badges">${list.map(x=>`<div class="badge ${x[2]?'':'locked'}"><div style="font-size:30px">${x[0]}</div><b>${x[1]}</b><div>${x[2]?'DESBLOQUEADA':'BLOQUEADA'}</div></div>`).join('')}</div>`;
}
function settings(){
 return `<h2>⚙️ AJUSTES</h2><div class="panel"><b>💾 Partida guardada automáticamente</b><p class="small">Tu colección, monedas, energía y progreso se guardan en este dispositivo.</p></div><button class="btn secondary" onclick="resetGame()">♻️ REINICIAR PARTIDA</button>`;
}
function resetGame(){
 if(confirm('¿Seguro que quieres borrar todo el progreso?')){
  localStorage.removeItem('portalMortys');
  localStorage.removeItem('portalMortysGameState');
  location.reload();
 }
}
const personajesPermitidos = Object.keys(MORTY_DATA);
mortys = mortys.filter(m => personajesPermitidos.includes(m.name));
if (!mortys.length) mortys = [{name:'Morty', ...MORTY_DATA['Morty'], xp:0, activo:true}];
localStorage.setItem('portalMortys', JSON.stringify(mortys));

function seleccionarMorty(i){
 if(!mortys[i]) return;
 mortys.forEach((m,n)=>m.activo=(n===i));
 localStorage.setItem('portalMortys', JSON.stringify(mortys));
 renderCollection();
}
function xpNecesaria(nivel){ return 100 + (nivel-1)*50; }
function ganarXP(morty, cantidad){
 morty.xp=(morty.xp||0)+cantidad;
 const req=xpNecesaria(morty.level||1);
 if(morty.xp>=req){
   morty.xp-=req; morty.level=(morty.level||1)+1;
   morty.hp+=5; morty.atk+=3; morty.def+=3; morty.spd+=2;
   return true;
 }
 return false;
}
function renderCollection(){
 const activos=mortys.filter(m=>m.activo);
 const activo=activos[0]||mortys[0];
 return `<div class="collection-screen">
  <div class="collection-head">
   <button class="backbtn" onclick="back()">← VOLVER</button>
   <h2>🧪 MIS MORTYS</h2>
   <div class="collection-count">${mortys.length}/6</div>
  </div>
  <div class="active-panel">
   <div class="active-title">👑 MORTY ACTIVO</div>
   <div class="active-body">
    <div class="big-icon">${activo?activo.icon:'🧪'}</div>
    <div class="active-info">
     <h3>${activo?activo.name:'Sin Morty'}</h3>
     <div class="rarity">${activo?(activo.rarity+' • '+activo.type):''}</div>
     <div class="level">⭐ NIVEL ${activo?(activo.level||1):1}</div>
     <div class="stats-row">
      <span>❤️ ${activo?activo.hp:0}</span>
      <span>⚔️ ${activo?activo.atk:0}</span>
      <span>🛡️ ${activo?activo.def:0}</span>
      <span>⚡ ${activo?activo.spd:0}</span>
     </div>
     <div class="xp-label">✨ XP ${activo?(activo.xp||0):0}/${activo?xpNecesaria(activo.level||1):100}</div>
     <div class="xp"><i style="width:${activo?Math.min(100,(activo.xp||0)/xpNecesaria(activo.level||1)*100):0}%"></i></div>
    </div>
   </div>
  </div>
  <h3 class="section-title">TU COLECCIÓN</h3>
  <div class="collection-grid">${mortys.map((m,i)=>{
   const req=xpNecesaria(m.level||1), xp=m.xp||0;
   return `<button class="collection-card ${m.activo?'selected':''}" onclick="seleccionarMorty(${i})">
    <div class="card-top"><span>${m.icon}</span>${m.activo?'<b>👑 ACTIVO</b>':''}</div>
    <h3>${m.name}</h3>
    <div class="rarity">${m.rarity} • ${m.type}</div>
    <div class="mini-level">⭐ Nivel ${m.level||1}</div>
    <div class="mini-stats">❤️${m.hp} &nbsp; ⚔️${m.atk} &nbsp; 🛡️${m.def} &nbsp; ⚡${m.spd}</div>
    <div class="xp-label">✨ ${xp}/${req} XP</div>
    <div class="xp"><i style="width:${Math.min(100,xp/req*100)}%"></i></div>
   </button>`;
  }).join('')}</div>
 </div>`;
}
function show(type){
 document.getElementById('screen').style.display='block';
 if(type==='menu'){back();return;}
 const views={collection:renderCollection,shop,quests,badges,settings};
 document.getElementById('content').innerHTML = views[type]?views[type]():settings();
}
function back(){document.getElementById('screen').style.display='none'}
function play(){
 document.getElementById('screen').style.display='block';
 document.getElementById('content').innerHTML=`
 <h2>📍 EXPLORACIÓN</h2>
 <div id="map">
   <div class="road r1"></div><div class="road r2"></div><div class="road r3"></div>
   <div class="player">🧑‍🔬</div>
   <button class="spawn s1" onclick="encounter('Morty Roñoso')">👦</button>
   <button class="spawn s2" onclick="encounter('Morty Conejo')">🐰</button>
   <button class="portalSpawn" onclick="encounter('Portal dimensional')">🌀</button>
   <div class="hud"><b>${(mortys.find(m=>m.activo)||mortys[0]).name}</b><br>⭐ Nivel 1<br>🧪 Mortys: <span id="count">${mortys.length}</span></div>
 </div>
 <p id="mapmsg">Explora la zona y toca un Morty.</p>`;
} 

function encounter(name){
 const msg=document.getElementById('mapmsg');
 if(name==='Portal dimensional'){
   gameState.quests.portals++; addXP(15); saveGameState(); msg.innerHTML='🌀 <b>¡Portal encontrado!</b> +15 XP. Podría llevarte a otra dimensión.';
   return;
 }
 if(!MORTY_DATA[name]) return;
 msg.innerHTML='⚡ <b>¡'+name+' apareció!</b> <button class="catch" onclick="catchMorty(\''+name+'\')">CAPTURAR</button> <button class="fight" onclick="startBattle(\''+name+'\')">⚔️ COMBATIR</button>';
}
let playerVida=35, enemyVida=45, enemyVidaMax=45, battleOver=false;
function startBattle(name){
 const data=MORTY_DATA[name] || MORTY_DATA['Morty'];
 playerVida=35; enemyVida=data.hp; enemyVidaMax=data.hp; battleOver=false;
 document.getElementById('screen').style.display='block';
 document.getElementById('content').innerHTML=`
 <h2>⚔️ COMBATE</h2>
 <div class="battle">
  <div class="arena">
   <div class="fighter"><div class="monster">🧑‍🔬</div><b>Rick</b><div class="hp"><i id="php"></i></div><span id="ptxt">35/35</span></div>
   <div class="fighter"><div class="monster">${data.icon}</div><b>${name}</b><div class="hp"><i id="ehp"></i></div><span id="etxt">${data.hp}/${data.hp}</span></div>
  </div>
  <div class="battlelog" id="battlelog">¡Apareció ${name}! Elige una habilidad.</div>
  <div class="actions">
   <button onclick="skill('golpe')">👊 Golpe — 8-14</button>
   <button onclick="skill('rapido')">⚡ Rápido — 5-10</button>
   <button onclick="skill('bloqueo')" class="dark">🛡️ Bloqueo</button>
   <button onclick="item()" class="dark">🧪 Poción +10</button>
   <button onclick="flee()" class="dark">🏃 Huir</button>
  </div>
 </div>`;
 updateVida();
}
function updateVida(){
 const maxEnemy = Math.max(1, enemyVidaMax || enemyVida);
 document.getElementById('php').style.width=(playerVida/35*100)+'%';
 document.getElementById('ehp').style.width=(enemyVida/maxEnemy*100)+'%';
 document.getElementById('ptxt').textContent=playerVida+'/35';
 document.getElementById('etxt').textContent=enemyVida+'/'+maxEnemy;
}
function enemyTurn(def=false){
 if(battleOver)return;
 let dmg=def?Math.floor(Math.random()*4)+2:Math.floor(Math.random()*6)+5;
 playerVida=Math.max(0,playerVida-dmg);
 document.getElementById('battlelog').textContent='👾 El Morty enemigo atacó e hizo '+dmg+' de daño.';
 if(playerVida<=0){battleOver=true;document.getElementById('battlelog').textContent+=' 💀 Has perdido.';}
 updateVida();
}
function skill(type){
 if(battleOver)return;
 if(type==='bloqueo'){
  document.getElementById('battlelog').textContent='🛡️ ¡Bloqueo activado! El próximo ataque hará poco daño.';
  setTimeout(()=>enemyTurn(true),450); return;
 }
 let dmg = type==='golpe' ? Math.floor(Math.random()*7)+8 : Math.floor(Math.random()*6)+5;
 enemyVida=Math.max(0,enemyVida-dmg);
 document.getElementById('battlelog').textContent=(type==='golpe'?'👊 ¡Golpe fuerte! ':'⚡ ¡Ataque rápido! ')+'Hiciste '+dmg+' de daño.';
 updateVida();
 if(enemyVida<=0){
 battleOver=true;
 gameState.quests.wins++; gameState.coins+=30; addXP(50); saveGameState();
 const activo=mortys.find(m=>m.activo)||mortys[0];
 const subio=activo?ganarXP(activo,50):false;
 localStorage.setItem('portalMortys', JSON.stringify(mortys));
 document.getElementById('battlelog').textContent+=' 🏆 ¡Ganaste el combate! +50 XP'+(subio?' 🎉 ¡Subió de nivel!':'');
 return;
}
 setTimeout(()=>enemyTurn(false),450);
}
function item(){
 if(battleOver)return;
 let heal=Math.min(10,35-playerVida); playerVida+=heal;
 document.getElementById('battlelog').textContent='🧪 Usaste una Mega Poción y recuperaste '+heal+' Vida.';
 updateVida(); setTimeout(()=>enemyTurn(false),450);
}
function flee(){
 if(battleOver)return;
 battleOver=true;
 document.getElementById('battlelog').textContent='🏃 Escapaste del combate.';
}
function catchMorty(name){
 if(gameState.capsules<=0){alert('No tienes cápsulas. Compra más en la tienda.');return;} gameState.capsules--; gameState.quests.captures++; addXP(20);
 const c=document.getElementById('count');
 c.textContent=Number(c.textContent)+1;
 if(!mortys.some(m=>m.name===name) && mortys.length<6){
   const data=MORTY_DATA[name];
   mortys.push({name, ...data, xp:0, activo:false});
 }
 if(!mortys.some(m=>m.activo)) mortys[0].activo=true;
 localStorage.setItem('portalMortys', JSON.stringify(mortys));
 document.getElementById('mapmsg').innerHTML='✅ <b>'+name+' capturado.</b> Ahora forma parte de tu equipo. Abre “Mis Mortys” para verlo.';
}
</script>
</body>
</html>
