<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Portal Mortys — Español Latino V15</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0f14;color:#fff;font-family:Arial,sans-serif}
.game{width:100%;max-width:520px;min-height:100vh;margin:auto;padding:18px;background:radial-gradient(circle at 50% 10%,#294531,#111820 45%,#090c11)}
h1,h2,h3,p{margin-top:0}
.logo{text-align:center;padding:28px 0 10px}
.logo h1{font-size:44px;line-height:.9;margin:0;color:#9cff57}
.logo p{color:#aeb8bf;letter-spacing:2px;font-size:11px}
.portal{width:175px;height:175px;margin:20px auto;border-radius:50%;border:7px solid #75ff4f;background:radial-gradient(circle,#d7fff0 0 8%,#67ffd0 12%,#168f86 32%,#153b43 65%,#091015 70%);box-shadow:0 0 25px #75ff4f,inset 0 0 35px #75ff4f;animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.topbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:#202b32;border:1px solid #3a4a52;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}
.panel,.card{background:#1a242b;border:1px solid #35454d;border-radius:17px;padding:14px;margin:10px 0}
.buttons{display:grid;gap:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{border:0;border-radius:13px;padding:15px;font-size:16px;font-weight:900;background:#9cff57;color:#10150e;box-shadow:0 4px 0 #4b9c2b}
.btn:active{transform:translateY(3px);box-shadow:none}
.dark{background:#27333a;color:#fff;box-shadow:0 4px 0 #11161a}
.footer{text-align:center;color:#59636a;font-size:10px;margin-top:18px}
#screen{display:none}
.back{border:0;border-radius:10px;background:#27333a;color:#fff;padding:10px 13px;font-weight:800}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-weight:800}
.xp,.energy,.hp{height:9px;background:#303b40;border-radius:99px;overflow:hidden;margin-top:7px}
.xp i{display:block;height:100%;background:#67d9ff}
.energy i,.hp i{display:block;height:100%;background:#9cff57}
.collection-grid,.shop-grid,.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.collection-card,.shop-item,.badge{background:#202b32;border:1px solid #3a4a52;border-radius:14px;padding:11px}
.collection-card.active{border:2px solid #9cff57}
.icon{font-size:45px;text-align:center}
.rarity{font-size:11px;color:#9cff57;font-weight:800}
.small{font-size:11px;color:#b8c2c8}
#map{height:430px;margin-top:12px;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(135deg,#49634c,#304936 45%,#65735a);border:3px solid #607667}
.road{position:absolute;background:#4a4e4a;box-shadow:inset 0 0 0 3px #696d67}
.r1{width:120%;height:58px;top:75px;left:-10%;transform:rotate(12deg)}
.r2{width:60px;height:120%;left:55%;top:-10%;transform:rotate(-20deg)}
.r3{width:100%;height:42px;bottom:95px;left:0;transform:rotate(-7deg)}
.player{position:absolute;left:48%;top:49%;font-size:34px;z-index:2}
.spawn,.portalSpawn{position:absolute;border:0;border-radius:50%;width:55px;height:55px;font-size:28px;background:#b9ff8c;box-shadow:0 0 18px #8cff62;z-index:3}
.s1{left:20%;top:25%}.s2{right:15%;bottom:24%}
.portalSpawn{right:12%;top:18%;background:#6ffff0;box-shadow:0 0 25px #45fff0}
.hud{position:absolute;left:10px;top:10px;background:#111c19dd;padding:9px 11px;border-radius:12px;font-size:12px;line-height:1.5}
.battle .arena{display:flex;gap:9px}
.fighter{flex:1;text-align:center;background:#202b32;border-radius:13px;padding:12px}
.monster{font-size:52px}.battlelog{min-height:48px;background:#0d1318;border-radius:10px;padding:10px;margin:10px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quest{padding:10px 0;border-bottom:1px solid #334047}
.quest:last-child{border-bottom:0}
.badge{text-align:center}.locked{opacity:.4}

.concept-wrap{margin:12px 0 14px;border:1px solid #34454b;border-radius:16px;overflow:hidden;background:#0a1014;box-shadow:0 0 22px #1eff8840}
.concept-art{display:block;width:100%;height:auto;max-height:310px;object-fit:cover}
.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}
.dash-card{background:#162126;border:1px solid #33434a;border-radius:13px;padding:11px}
.dash-card b{font-size:14px}.dash-card .small{margin-top:4px}
.progress{height:7px;background:#29363c;border-radius:99px;overflow:hidden;margin-top:6px}.progress i{display:block;height:100%;background:#8cff62}


#cover{
position:fixed;inset:0;z-index:9999;background:#05070a;
display:flex;align-items:center;justify-content:center;overflow:hidden;
}
#cover img{
width:100%;height:100%;object-fit:contain;display:block;
}
.cover-hotspot{
position:absolute;border:0;background:transparent;padding:0;cursor:pointer;
}
.cover-hotspot:active{background:rgba(156,255,77,.14);border-radius:12px}
.cover-jugar{left:20%;top:50%;width:60%;height:6%}
.cover-continuar{left:22%;top:56%;width:56%;height:5.5%}
.cover-opciones{left:22%;top:61%;width:56%;height:5.5%}
.cover-mortypedia{left:2%;top:54%;width:22%;height:16%}
.cover-tienda{right:2%;top:54%;width:22%;height:16%}
.cover-ajustes{left:2%;top:69%;width:22%;height:15%}
.cover-logros{right:2%;top:69%;width:22%;height:15%}
</style>
</head>
<body>

<div id="cover">
  <img src="portada.jpg?v=15" alt="Portada Portal Mortys">
  <button class="cover-hotspot cover-jugar" aria-label="Jugar" onclick="startGame()"></button>
  <button class="cover-hotspot cover-continuar" aria-label="Continuar" onclick="startGame()"></button>
  <button class="cover-hotspot cover-opciones" aria-label="Opciones" onclick="alert('Opciones: próximamente configurables.')"></button>
  <button class="cover-hotspot cover-mortypedia" aria-label="Mortypedia" onclick="startGame()"></button>
  <button class="cover-hotspot cover-tienda" aria-label="Tienda" onclick="startGame()"></button>
  <button class="cover-hotspot cover-ajustes" aria-label="Ajustes" onclick="alert('Ajustes: próximamente configurables.')"></button>
  <button class="cover-hotspot cover-logros" aria-label="Logros" onclick="startGame()"></button>
</div>

<div class="game">
<div id="menu">
  <div class="logo">
    <h1>PORTAL<br>MORTYS</h1>
    <p>DIMENSIONES • CAPTURA • COMBATE</p>
    <div class="portal"></div>
  </div>
  <div class="topbar">
    <span class="pill">⭐ Nv. <b id="lv">1</b></span>
    <span class="pill">💰 <b id="coins">150</b></span>
    <span class="pill">🧪 <b id="count">1</b>/6</span>
    <span class="pill">🔵 <b id="caps">5</b></span>
  </div>
  <div class="dashboard">
    <div class="dash-card"><b>👑 Equipo activo</b><div id="dashTeam" class="small">Morty listo para combatir</div></div>
    <div class="dash-card"><b>📜 Misiones</b><div id="dashQuest" class="small">0/3 victorias</div><div class="progress"><i id="dashQuestBar" style="width:0%"></i></div></div>
    <div class="dash-card"><b>🎒 Recursos</b><div id="dashItems" class="small">5 cápsulas • 3 pociones</div></div>
    <div class="dash-card"><b>🏅 Medallas</b><div id="dashBadges" class="small">0 desbloqueadas</div></div>
  </div>
  <div class="panel small">Entrenador • <span id="txp">0/100 XP</span></div>
  <div class="buttons">
    <button class="btn" onclick="explore()">📍 JUGAR / EXPLORAR</button>
    <div class="grid2">
      <button class="btn dark" onclick="show('collection')">🧪 MIS MORTYS</button>
      <button class="btn dark" onclick="show('shop')">🏪 TIENDA</button>
      <button class="btn dark" onclick="show('quests')">📜 MISIONES</button>
      <button class="btn dark" onclick="show('badges')">🏅 MEDALLAS</button>
    </div>
    <button class="btn dark" onclick="show('settings')">⚙️ AJUSTES</button>
  </div>
  <div class="footer">PROTOTIPO • HECHO PARA MÓVIL</div>
</div>
<div id="screen">
  <button class="back" onclick="back()">← VOLVER</button>
  <div id="content" class="card"></div>
</div>
</div>

const DATA={

const MORTYS_EXTRA={
"Morty Conejo Malvado":{tipo:"Tijeras",rareza:"RARO",nivel:2,hp:42,atk:40,def:34,spd:48,icon:"🐰"},
"Morty sin Ojos":{tipo:"Papel",rareza:"COMÚN",nivel:1,hp:35,atk:34,def:32,spd:35,icon:"😶"},
"Morty Tuerto":{tipo:"Papel",rareza:"RARO",nivel:2,hp:40,atk:38,def:35,spd:37,icon:"👁️"},
"Morty Tres Ojos":{tipo:"Papel",rareza:"ÉPICO",nivel:3,hp:47,atk:45,def:40,spd:39,icon:"👁️"},
"Morty Autodefensa":{tipo:"Piedra",rareza:"COMÚN",nivel:1,hp:39,atk:37,def:42,spd:27,icon:"🥋"},
"Morty Karateka":{tipo:"Piedra",rareza:"RARO",nivel:2,hp:44,atk:46,def:43,spd:35,icon:"🥋"},
"Morty sin Piedad":{tipo:"Piedra",rareza:"ÉPICO",nivel:3,hp:49,atk:52,def:45,spd:38,icon:"🥋"},
"Morty Bigotes":{tipo:"Tijeras",rareza:"COMÚN",nivel:1,hp:35,atk:37,def:31,spd:42,icon:"🥸"},
"Morty Barbudo":{tipo:"Tijeras",rareza:"RARO",nivel:2,hp:42,atk:44,def:36,spd:45,icon:"🧔"},
"Morty Hipster":{tipo:"Tijeras",rareza:"ÉPICO",nivel:3,hp:48,atk:50,def:40,spd:47,icon:"🧔"},
"Morty Cuchara":{tipo:"Piedra",rareza:"COMÚN",nivel:1,hp:41,atk:39,def:39,spd:28,icon:"🥄"},
"Morty Tenedor":{tipo:"Piedra",rareza:"RARO",nivel:2,hp:46,atk:44,def:43,spd:30,icon:"🍴"},
"Morty Cuchador":{tipo:"Piedra",rareza:"ÉPICO",nivel:3,hp:51,atk:49,def:47,spd:32,icon:"🍴"},
"Morty Pacifista":{tipo:"Papel",rareza:"COMÚN",nivel:1,hp:42,atk:30,def:44,spd:31,icon:"☮️"},
"Morty Hippie":{tipo:"Papel",rareza:"RARO",nivel:2,hp:47,atk:35,def:48,spd:34,icon:"🌼"},
"Morty Pirado":{tipo:"Papel",rareza:"ÉPICO",nivel:3,hp:53,atk:43,def:52,spd:37,icon:"🌀"},
"Morty Cabezón":{tipo:"Piedra",rareza:"COMÚN",nivel:1,hp:48,atk:40,def:40,spd:18,icon:"🗿"},
"Morty MegaCabezón":{tipo:"Piedra",rareza:"RARO",nivel:2,hp:55,atk:47,def:48,spd:17,icon:"🗿"},
"Morty Cabezón Colosal":{tipo:"Piedra",rareza:"ÉPICO",nivel:3,hp:62,atk:55,def:56,spd:15,icon:"🗿"},
"Morty Escalofriante":{tipo:"Papel",rareza:"COMÚN",nivel:1,hp:37,atk:35,def:34,spd:41,icon:"👻"},
"Morty Fantasmal":{tipo:"Papel",rareza:"RARO",nivel:2,hp:43,atk:42,def:38,spd:46,icon:"👻"},
"Morty Aparición":{tipo:"Papel",rareza:"ÉPICO",nivel:3,hp:50,atk:50,def:43,spd:50,icon:"👻"},
"Morty Doble":{tipo:"Tijeras",rareza:"COMÚN",nivel:1,hp:37,atk:38,def:32,spd:43,icon:"👥"},
"Morty Triple":{tipo:"Tijeras",rareza:"RARO",nivel:2,hp:44,atk:45,def:36,spd:47,icon:"👥"},
"Morty Múltiple":{tipo:"Tijeras",rareza:"ÉPICO",nivel:3,hp:52,atk:53,def:42,spd:52,icon:"👥"},
"Morty Mazado":{tipo:"Piedra",rareza:"COMÚN",nivel:1,hp:50,atk:48,def:42,spd:25,icon:"💪"},
"Morty Luchador":{tipo:"Piedra",rareza:"RARO",nivel:2,hp:57,atk:55,def:48,spd:29,icon:"🤼"},
"Morty Venoso":{tipo:"Tijeras",rareza:"COMÚN",nivel:1,hp:36,atk:40,def:30,spd:44,icon:"🩸"},
"Morty Despellejado":{tipo:"Tijeras",rareza:"RARO",nivel:2,hp:42,atk:47,def:34,spd:48,icon:"💀"},

"Morty Brujo":{tipo:"Piedra",rareza:"ÉPICO",nivel:3,hp:51,atk:58,def:43,spd:41,icon:"🧙"},
"Morty Telépata":{tipo:"Tijeras",rareza:"COMÚN",nivel:1,hp:34,atk:41,def:30,spd:46,icon:"🧠"},
"Morty Telequinésico":{tipo:"Tijeras",rareza:"RARO",nivel:2,hp:41,atk:48,def:35,spd:51,icon:"🧠"},
"Morty Psicoquinético":{tipo:"Tijeras",rareza:"ÉPICO",nivel:3,hp:48,atk:57,def:41,spd:55,icon:"🧠"},
"Morty Nadador":{tipo:"Piedra",rareza:"COMÚN",nivel:1,hp:44,atk:38,def:39,spd:39,icon:"🏊"},
"Morty Sirena":{tipo:"Piedra",rareza:"RARO",nivel:2,hp:50,atk:45,def:45,spd:43,icon:"🧜"},
"Morty Sirena del Revés":{tipo:"Piedra",rareza:"ÉPICO",nivel:3,hp:57,atk:53,def:51,spd:47,icon:"🧜"},
"Morty Huevo":{tipo:"Piedra",rareza:"ÉPICO",nivel:1,hp:55,atk:35,def:55,spd:12,icon:"🥚"},
"Morty el Verdadero":{tipo:"Normal",rareza:"EXÓTICO",nivel:5,hp:75,atk:75,def:75,spd:75,icon:"⭐"}
};
for(const [n,d] of Object.entries(MORTYS_EXTRA))DATA[n]=d;

let state=JSON.parse(localStorage.getItem("portalMortysV15"))||{
coins:150,caps:5,potions:3,energy:10,maxEnergy:10,zone:1,trainerXP:0,trainerLevel:1,
quests:{captures:0,wins:0,portals:0},
mortys:[{name:"Morty",...DATA["Morty"],xp:0,active:true}]
};
state.mortys=state.mortys.filter(m=>DATA[m.name]);
if(!state.mortys.length)state.mortys=[{name:"Morty",...DATA["Morty"],xp:0,active:true}];

function save(){localStorage.setItem("portalMortysV15",JSON.stringify(state));refresh();}
function refresh(){
document.getElementById("lv").textContent=state.trainerLevel;
document.getElementById("coins").textContent=state.coins;
document.getElementById("count").textContent=state.mortys.length;
document.getElementById("caps").textContent=state.caps;
document.getElementById("txp").textContent=state.trainerXP+"/"+(100+(state.trainerLevel-1)*100)+" XP";
const a=active();
const team=document.getElementById("dashTeam"), quest=document.getElementById("dashQuest"), bar=document.getElementById("dashQuestBar");
const items=document.getElementById("dashItems"), badgesEl=document.getElementById("dashBadges");
if(team)team.textContent=a.name+" • Nv. "+a.nivel+" • "+a.tipo;
if(quest){const w=Math.min(state.quests.wins,3);quest.textContent=w+"/3 victorias";bar.style.width=(w/3*100)+"%";}
if(items)items.textContent=state.caps+" cápsulas • "+state.potions+" pociones • "+state.energy+" energía";
if(badgesEl)badgesEl.textContent=[state.quests.captures>=1,state.quests.wins>=1,state.quests.portals>=1,state.mortys.length>=6,state.trainerLevel>=5,state.quests.wins>=10].filter(Boolean).length+" desbloqueadas";
}
function show(type){
document.getElementById("menu").style.display="none";
document.getElementById("screen").style.display="block";
const views={collection:collection,shop:shop,quests:quests,badges:badges,settings:settings};
document.getElementById("content").innerHTML=views[type]();
}
function back(){document.getElementById("screen").style.display="none";document.getElementById("menu").style.display="block";refresh();}
function active(){return state.mortys.find(m=>m.active)||state.mortys[0];}
function xpNeed(l){return 100+(l-1)*50}
function addXP(n){
state.trainerXP+=n;
let need=100+(state.trainerLevel-1)*100;
while(state.trainerXP>=need){state.trainerXP-=need;state.trainerLevel++;need=100+(state.trainerLevel-1)*100;}
}
function collection(){
return `<h2>🧪 MIS MORTYS</h2>
<div class="panel"><b>👑 Morty activo</b><div class="icon">${active().icon}</div>
<h3>${active().name}</h3><div class="rarity">${active().rareza} • ${active().tipo}</div>
<p>⭐ Nivel ${active().nivel}</p><div class="statgrid"><span>❤️ ${active().hp}</span><span>⚔️ ${active().atk}</span><span>🛡️ ${active().def}</span><span>⚡ ${active().spd}</span></div>
<div class="small">✨ XP ${active().xp||0}/${xpNeed(active().nivel)}</div><div class="xp"><i style="width:${Math.min(100,(active().xp||0)/xpNeed(active().nivel)*100)}%"></i></div></div>
<h3>Tu colección: ${state.mortys.length}/6</h3>
<div class="collection-grid">${state.mortys.map((m,i)=>`<button class="collection-card ${m.active?"active":""}" onclick="selectMorty(${i})">
<div class="icon">${m.icon}</div><b>${m.name}</b><div class="rarity">${m.rareza}</div><div>⭐ Nv. ${m.nivel}</div><div class="small">❤️${m.hp} ⚔️${m.atk} 🛡️${m.def} ⚡${m.spd}</div>
</button>`).join("")}</div>
<div class="panel"><b>🧬 Evolución</b><p class="small">Algunas líneas evolucionan mediante fusión de dos Mortys iguales.</p><button class="btn dark" onclick="evolveActive()">🧬 EVOLUCIONAR ACTIVO</button></div>`;
}
function evolveActive(){
 const m=active(), next=EVOLUCIONES[m.name];
 if(!next)return alert("Este Morty no tiene una evolución registrada.");
 const needed=2;
 const copies=state.mortys.filter(x=>x.name===m.name);
 if(copies.length<needed)return alert("Necesitas 2 copias de "+m.name+" para evolucionarlo.");
 const target=next[0];
 if(!DATA[target])return alert("La evolución aún no está disponible en esta versión.");
 let removed=0;
 state.mortys=state.mortys.filter(x=>{if(x.name===m.name&&removed<2){removed++;return false}return true;});
 state.mortys.push({name:target,...DATA[target],xp:0,active:true});
 state.mortys.forEach(x=>{if(x.name!==target)x.active=false});
 addXP(40);save();show("collection");
}
function selectMorty(i){state.mortys.forEach((m,n)=>m.active=n===i);save();show("collection");}
function shop(){
return `<h2>🏪 TIENDA</h2><div class="panel">💰 Monedas: <b>${state.coins}</b></div>
<div class="shop-grid">
<div class="shop-item"><h3>🔵 Cápsula</h3><p>+1 captura</p><b>25 💰</b><button class="btn dark" onclick="buy('caps')">COMPRAR</button></div>
<div class="shop-item"><h3>🧪 Poción</h3><p>+1 curación</p><b>20 💰</b><button class="btn dark" onclick="buy('potions')">COMPRAR</button></div>
<div class="shop-item"><h3>⚡ Energía</h3><p>+3 energía</p><b>15 💰</b><button class="btn dark" onclick="buy('energy')">COMPRAR</button></div></div>`;
}
function buy(x){
let cost={caps:25,potions:20,energy:15}[x];if(state.coins<cost)return alert("No tienes suficientes monedas.");
state.coins-=cost;if(x==="caps")state.caps++;if(x==="potions")state.potions++;if(x==="energy")state.energy=Math.min(state.maxEnergy,state.energy+3);save();show("shop");
}
function quests(){
let q=state.quests;return `<h2>📜 MISIONES</h2>
<div class="quest"><b>🎯 Capturista</b><br>Captura 3 Mortys: ${Math.min(q.captures,3)}/3</div>
<div class="quest"><b>⚔️ Entrenador</b><br>Gana 3 combates: ${Math.min(q.wins,3)}/3</div>
<div class="quest"><b>🌀 Explorador</b><br>Encuentra 2 portales: ${Math.min(q.portals,2)}/2</div>`;
}
function badges(){
let q=state.quests,arr=[["🧪","Primer Morty",q.captures>=1],["⚔️","Primera victoria",q.wins>=1],["🌀","Primer portal",q.portals>=1],["🏆","Coleccionista",state.mortys.length>=6],["⭐","Nivel 5",state.trainerLevel>=5],["🔥","Veterano",q.wins>=10]];
return `<h2>🏅 MEDALLAS</h2><div class="badges">${arr.map(b=>`<div class="badge ${b[2]?"":"locked"}"><div class="icon">${b[0]}</div><b>${b[1]}</b><p>${b[2]?"DESBLOQUEADA":"BLOQUEADA"}</p></div>`).join("")}</div>`;
}
function settings(){
return `<h2>⚙️ AJUSTES</h2><div class="panel">💾 La partida se guarda automáticamente en este dispositivo.</div><div class="panel"><b>⚔️ Tipos</b><p class="small">Piedra vence a Tijeras • Tijeras vence a Papel • Papel vence a Piedra.</p></div><button class="btn dark" onclick="resetGame()">♻️ REINICIAR PARTIDA</button>`;
}
function resetGame(){if(confirm("¿Borrar todo el progreso?")){localStorage.removeItem("portalMortysV15");location.reload();}}
function explore(){
document.getElementById("menu").style.display="none";document.getElementById("screen").style.display="block";
let zones=["Jardines","Ciudad Mutante","Laboratorio","Dimensión Oscura"];
document.getElementById("content").innerHTML=`<div class="topbar"><span class="pill">💰 ${state.coins}</span><span class="pill">🔵 ${state.caps}</span><span class="pill">🧪 ${state.potions}</span><span class="pill">⚡ ${state.energy}/${state.maxEnergy}</span></div>
<h2>📍 EXPLORACIÓN</h2><div class="panel"><b>DIMENSIÓN ${state.zone}: ${zones[state.zone-1]}</b><div class="energy"><i style="width:${state.energy/state.maxEnergy*100}%"></i></div></div>
<div id="map"><div class="road r1"></div><div class="road r2"></div><div class="road r3"></div><div class="player">🧑‍🔬</div>
<button class="spawn s1" onclick="randomEncounter()">👾</button><button class="spawn s2" onclick="randomEncounter()">👾</button><button class="portalSpawn" onclick="portal()">🌀</button>
<div class="hud"><b>${active().name}</b><br>⭐ Entrenador ${state.trainerLevel}<br>🧪 Mortys: ${state.mortys.length}/6</div></div>
<p id="msg">Explora la zona y toca un encuentro.</p><div class="grid2"><button class="btn dark" onclick="changeZone(-1)">◀ ZONA</button><button class="btn dark" onclick="changeZone(1)">ZONA ▶</button></div>`;
}
function changeZone(d){if(state.energy<=0)return alert("No tienes energía.");state.energy--;state.zone=Math.max(1,Math.min(4,state.zone+d));save();explore();}
function portal(){state.quests.portals++;addXP(15);save();document.getElementById("msg").innerHTML="🌀 <b>¡Portal encontrado!</b> +15 XP."; }
function randomEncounter(){
 const pools=[
 ["Morty Roñoso","Morty Desaliñado","Morty Mendigo","Morty Viejo","Morty Conejo"],
 ["Morty sin Ojos","Morty Autodefensa","Morty Bigotes","Morty Cuchara","Morty Pacifista"],
 ["Morty Cabezón","Morty Escalofriante","Morty Doble","Morty Mazado","Morty Mago"],
 ["Morty Telépata","Morty Nadador","Morty Venoso","Morty Múltiple","Morty Esqueleto"]
 ];
 const p=pools[state.zone-1]||pools[0];
 encounter(p[Math.floor(Math.random()*p.length)]);
}
function encounter(name){let msg=document.getElementById("msg");msg.innerHTML=`⚡ <b>¡${name} apareció!</b><br><br><button class="btn" onclick="capture('${name}')">🔵 CAPTURAR</button> <button class="btn dark" onclick="battle('${name}')">⚔️ COMBATIR</button>`;}
function capture(name){
if(state.caps<=0)return alert("No tienes cápsulas.");state.caps--;state.quests.captures++;addXP(20);
if(state.mortys.length<6&&!state.mortys.some(m=>m.name===name)){state.mortys.push({name,...DATA[name],xp:0,active:false});}
save();document.getElementById("msg").innerHTML=`✅ <b>${name} capturado.</b> Ya forma parte de tu colección.`;
}
let pHP=35,eHP=0,eMax=0,enemyName="";
function battle(name){
enemyName=name;eMax=DATA[name].hp;eHP=eMax;pHP=35;
document.getElementById("content").innerHTML=`<h2>⚔️ COMBATE</h2><div class="battle panel"><div class="arena">
<div class="fighter"><div class="monster">🧑‍🔬</div><b>Rick</b><div class="hp"><i id="ph"></i></div><span id="pt">35/35</span></div>
<div class="fighter"><div class="monster">${DATA[name].icon}</div><b>${name}</b><div class="hp"><i id="eh"></i></div><span id="et">${eHP}/${eMax}</span></div></div>
<div class="battlelog" id="log">¡Apareció ${name}! Elige una habilidad.</div><div class="actions">
<button class="btn" onclick="attack(8,14)">👊 Golpe</button><button class="btn" onclick="attack(5,10)">⚡ Rápido</button><button class="btn dark" onclick="block()">🛡️ Bloqueo</button><button class="btn dark" onclick="heal()">🧪 Poción</button><button class="btn dark" onclick="flee()">🏃 Huir</button></div></div>`;
updateBattle();
}
function updateBattle(){document.getElementById("ph").style.width=pHP/35*100+"%";document.getElementById("eh").style.width=eHP/eMax*100+"%";document.getElementById("pt").textContent=pHP+"/35";document.getElementById("et").textContent=eHP+"/"+eMax;}
function enemy(def=false){let d=def?2+Math.floor(Math.random()*3):5+Math.floor(Math.random()*6);pHP=Math.max(0,pHP-d);document.getElementById("log").textContent=`👾 ${enemyName} hizo ${d} de daño.`;updateBattle();if(pHP<=0)document.getElementById("log").textContent+=" 💀 Perdiste."; }
function attack(a,b){
 if(pHP<=0||eHP<=0)return;
 const moves=[["Golpe preciso",a,b],["Ataque veloz",Math.max(4,a-3),Math.max(7,b-3)]];
 const move=moves[Math.floor(Math.random()*moves.length)];
 let d=move[1]+Math.floor(Math.random()*(move[2]-move[1]+1));
 const rival=DATA[enemyName],me=active();
 if(me.tipo==="Piedra"&&rival.tipo==="Tijeras")d=Math.floor(d*1.25);
 if(me.tipo==="Tijeras"&&rival.tipo==="Papel")d=Math.floor(d*1.25);
 if(me.tipo==="Papel"&&rival.tipo==="Piedra")d=Math.floor(d*1.25);
 if((me.tipo==="Tijeras"&&rival.tipo==="Piedra")||(me.tipo==="Papel"&&rival.tipo==="Tijeras")||(me.tipo==="Piedra"&&rival.tipo==="Papel"))d=Math.max(1,Math.floor(d*.8));
 eHP=Math.max(0,eHP-d);
 document.getElementById("log").textContent=`💥 ${move[0]} hizo ${d} de daño.`;
 updateBattle();
 if(eHP<=0){
  state.quests.wins++;state.coins+=30;addXP(50);let m=active();m.xp=(m.xp||0)+50;
  while(m.xp>=xpNeed(m.nivel)){m.xp-=xpNeed(m.nivel);m.nivel++;m.hp+=5;m.atk+=3;m.def+=3;m.spd+=2;}
  save();document.getElementById("log").textContent+=" 🏆 ¡Ganaste! +30 monedas y +50 XP.";return;
 }
 setTimeout(()=>enemy(false),350);
}
function block(){if(eHP<=0)return;document.getElementById("log").textContent="🛡️ Bloqueo activado.";setTimeout(()=>enemy(true),350);}
function heal(){if(state.potions<=0)return alert("No tienes pociones.");state.potions--;pHP=Math.min(35,pHP+10);document.getElementById("log").textContent="🧪 Recuperaste 10 de vida.";updateBattle();setTimeout(()=>enemy(false),350);save();}
function flee(){document.getElementById("log").textContent="🏃 Escapaste del combate.";}
refresh();

function startGame(){
  const c=document.getElementById("cover");
  if(c)c.style.display="none";
  try{localStorage.setItem("portalMortysStarted","1")}catch(e){}
}

</script>
</body>
</html>
